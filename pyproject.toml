[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blueprints"
version = "0.1.0"
description = "Runnable reference code for open AI architecture blueprints: chunking, long-document RAG, tiered OCR and agent memory."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ajith Thaduri" }]
dependencies = []

[project.optional-dependencies]
embed = ["sentence-transformers>=3"]
pdf = ["pypdf>=4", "pypdfium2>=4", "pillow>=10"]
vlm = ["httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Blueprints = "https://www.ajiththaduri.site/blueprints"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprints"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
